<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>[Name]'s Site</title>
    </head>
    <body>
        <div class="header">
            <h1>Welcome</h1>
            <p>This is a test site for HTML/CSS/JavaScript.</p>
            <p>Unfortunately, no custom images will be used.</p>
        </div>

        <!-- Contains everything in the site. The "contents", if you will -->
        <div class="container">
            <!-- The header of the website -->

            <!-- The navbar. Sits on the left & contains the site links. -->
            <div class="nav">
                <h2><u>Navigation</u></h2>
                <button class="navbutton" style="--color-main: lightcoral; --color-hover: indianred;">Button</button>
                <button class="navbutton" style="--color-main: peachpuff; --color-hover: orange;">Button</button>
                <button class="navbutton" style="--color-main: lemonchiffon; --color-hover: goldenrod;">Button</button>
                <button class="navbutton" style="--color-main: palegreen; --color-hover: mediumseagreen;">Button</button>
                <button class="navbutton" style="--color-main: lightskyblue; --color-hover: royalblue;">Button</button>
                <button class="navbutton" style="--color-main: plum; --color-hover: mediumpurple;">Button</button>
                <button class="navbutton" style="--color-main: lightpink; --color-hover: hotpink;">Button</button>
            </div>

            <!-- The main content of the page. Paragraphs, images, etc. -->
            <div class="content">
                <p>This is the content. Is this cool?</p>
            </div>
        </div>
    </body>
</html>
