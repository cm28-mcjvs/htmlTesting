<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>RNG Test</title>
</head>
<body>
    <!-- Contains everything in the site. The "contents", if you will -->
    <div class="container">
        <div class="content">
            <h1>RNG Testing</h1>
            <div class="break"></div>
            <!-- Variable Displays & Toggles -->
            <p id ="coinText" style="margin-bottom: 4px">Coins: 0</p><p style="margin-bottom: 8px;">&nbsp;|&nbsp;</p><p id="luckText" style="margin-bottom: 4px">Luck: 1x</p>
            <div class="break"></div>
            <p id="timeText" style="margin-bottom: 12px; margin-top: 0px;">Playtime: 0s</p>
            <div class="break"></div>
            <button type="button" id="autoButton" onclick="toggleAuto()">Auto Roll: ON</button>&nbsp;
            <button type="button" id="oddsButton" onclick="toggleOdds()">Odds: Percentage</button>
            <div class="break"></div>
            <!-- Main Button -->
            <button type="button" class="mainbutton" onclick="onClick()" style="margin-top: 10px" id="rollButton">ROLL</button>
            <div class="break"></div>
            <p id="bestRollText" style="margin-top: 4px; margin-bottom: 12px; font-size: 24px">Best Roll: RARITY</p>
            <p id="bestRollGlow"></p>
            <div class="contentblock">
                <p id="lastRollText" style="margin-bottom: 4px; margin-top: 16px; font-size: 32px">RARITY</p>
                <p id="lastRollGlow"></p>
                <div class="break"></div>
                <p id="lastRollOdds" style="margin-bottom: 16px; margin-top: 4px; font-size: 20px">(??%)</p>
                <p id="lastRollGlow2"></p>
            </div>

            <!-- Purchase Buttons, hopefully -->
            <h2>Shop</h2>
            <div class="contentblock">
                <p id="cost1Label">Soon</p> &nbsp; &nbsp; <button type="button" class="buybutton" onclick="buyUpgrade('1')" id="effect1Label">Luck Boost: 1x</button>
                <div class="break"></div>
                <p id="cost2Label">Soon</p> &nbsp; &nbsp; <button type="button" class="buybutton" onclick="buyUpgrade('2')" id="effect2Label">Roll Speed: 1x</button>
                <div class="break"></div>
                <p id="cost3Label">Soon</p> &nbsp; &nbsp; <button type="button" class="buybutton" onclick="buyUpgrade('3')" id="effect3Label">Coin Boost: 1x</button>
            </div>
        </div>
    </div>

    <!-- Load the JavaScript files -->
    <script src="rng.js"></script>
</body>
</html>
